<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Boxes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .box {
      width: 200px;
      height: 150px;
      background-color: #fff;
      border: 5px solid #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .user-box {
      background-color: #88c2ff; /* light blue */
    }

    .worker-box {
      background-color: #d4edda; /* light green */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box user-box"><a href="user.html">user</a></div>
    <div class="box worker-box"><a href="worker.html">Worker</a></div>
  </div>
</body>
</html>
